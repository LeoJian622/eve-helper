server:
  port: 9999
  tomcat:
    threads:
      # 007 T036:显式声明容量上限,不再依赖 Boot 默认值(默认 200/8192)。
      # 这两个值是「洪泛容忍度」的分母 —— 任何在工作线程上阻塞的逻辑(如曾被推翻的
      # refresh 延迟整形)都会把它们变成全站可用性上限,故必须可见、可审、可调。
      max: 200
      min-spare: 10
    # 超出线程数后的排队长度;队满即拒新连接(快速失败优于无界排队)
    accept-count: 100
    max-connections: 8192

spring:
  datasource:
    druid:
      system:
        username: ${DB_SYSTEM_USERNAME}
        password: ${DB_SYSTEM_PASSWORD}
        url: jdbc:mysql://${DB_HOST}:${DB_PORT}/eve_helper?serverTimezone=UTC&useUnicode=true&characterEncoding=utf8
        driverClassName: com.mysql.cj.jdbc.Driver
        #初始化连接池的连接数量 大小，最小，最大
        initial-size: 5
        min-idle: 5
        max-active: 20
        #配置获取连接等待超时的时间
        max-wait: 60000
        #配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        time-between-eviction-runs-millis: 60000
        # 配置一个连接在池中最小生存的时间，单位是毫秒
        min-evictable-idle-time-millis: 30000
        # 配置一个连接在池中最大生存的时间，单位是毫秒
        max-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: true
        test-on-return: false
        # 是否缓存preparedStatement，也就是PSCache  官方建议MySQL下建议关闭   个人建议如果想用SQL防火墙 建议打开
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
        filters: stat,wall,slf4j
        filter:
          stat:
            merge-sql: true
            slow-sql-millis: 5000
      eve:
        username: ${DB_EVE_USERNAME}
        password: ${DB_EVE_PASSWORD}
        url: jdbc:mysql://${DB_HOST}:${DB_PORT}/eve?useUnicode=true&characterEncoding=utf8
        driverClassName: com.mysql.cj.jdbc.Driver
        #初始化连接池的连接数量 大小，最小，最大
        initial-size: 5
        min-idle: 5
        max-active: 20
        #配置获取连接等待超时的时间
        max-wait: 60000
        #配置间隔多久才进行一次检测，检测需要关闭的空闲连接，单位是毫秒
        time-between-eviction-runs-millis: 60000
        # 配置一个连接在池中最小生存的时间，单位是毫秒
        min-evictable-idle-time-millis: 30000
        # 配置一个连接在池中最大生存的时间，单位是毫秒
        max-evictable-idle-time-millis: 300000
        validation-query: SELECT 1
        test-while-idle: true
        test-on-borrow: true
        test-on-return: false
        # 是否缓存preparedStatement，也就是PSCache  官方建议MySQL下建议关闭   个人建议如果想用SQL防火墙 建议打开
        pool-prepared-statements: true
        max-pool-prepared-statement-per-connection-size: 20
        # 配置监控统计拦截的filters，去掉后监控界面sql无法统计，'wall'用于防火墙
        filters: stat,wall,slf4j
        filter:
          stat:
            merge-sql: true
            slow-sql-millis: 5000
      #3.基础监控配置
      web-stat-filter:
        enabled: false
      stat-view-servlet:
        enabled: false
  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: GMT+8
  cache:
    redis:
      time-to-live: 3000s
  #  ai:
  #    dashscope:
  #      api-key: ${AI_DASHSCOPE_API_KEY}
  data:
    redis:
      host: ${REDIS_HOST}
      password: ${REDIS_PASSWORD}
      port: 6379
# 日志配置
logging:
  level:
    # 007 T038:root 必须显式声明 —— SecurityBaselineValidator 对缺失该键 fail-closed 拒启
    root: info
    # ⚠️ 本节任何 logger 都不可设为 debug/trace(007 T038 起启动期硬校验,违反即拒启):
    #   - web         → AbstractHttpMessageConverter 在 DEBUG 下打印响应体片段,ESI accessToken
    #                   的 "Bearer eyJ..." 落入日志(006 FR-014)
    #   - reactor.netty → ESI 客户端请求头落盘,含 Authorization: Bearer <token>
    #   - ...persistence.mapper → 配合 Slf4jImpl 打 SQL 绑定参数,refresh_token 明文入日志
    #                   (与 log-impl 基线等效,是同一泄露的另一侧)
    web:  info
#  file:
#    path: src\main\resource\log\
mybatis-plus:
  configuration:
    # 驼峰下划线转换
    map-underscore-to-camel-case: true
    # 必须用 Slf4jImpl 而非 StdOutImpl:后者无条件打印全部 SQL 绑定参数,
    # 会把 eve_account.refresh_token(ESI 长期凭证,明文存储)输出到 stdout(006 feature FR-014)
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
jwt-token:
  issuer: eve-helper.xyz
  subject: eve-helper
  expirationTime: 7200
  accessTokenExpirationTime: 900  # 15分钟
  refreshTokenExpirationTime: 604800  # 7天

security:
  keystore:
    location: ${KEYSTORE_LOCATION}
    password: ${KEYSTORE_PASSWORD}
    # 007 T026:别名给默认值 eve-jwt(生产新密钥沿用该别名,减少环境变量面)
    alias: ${KEYSTORE_ALIAS:eve-jwt}
    key-password: ${KEY_PASSWORD}

eve:
  helper:
    whiteUrlList:
      #      - GET:/
      - POST:/user
      # 007 T014:refresh 端点须在无有效 access token 时可达(否则旧 token 客户端陷入 401 死循环)。
      # ⚠️ whiteUrlList 是 List 属性,profile 文件整体覆盖 application.yml ——
      # 任何自带 whiteUrlList 的 profile(test/ali/aliw/prod)都必须同步本行,
      # 否则加白在该 profile 静默失效(SC-016 同型风险)。
      - POST:/auth/tokens
    debug:
      access-token-endpoint:
        # 角色 ESI accessToken 查询端点开关。该端点交出可直接冒用的 bearer 凭证,
        # 仅供内部调试/运维排查,生产必须保持 false;需要排查时临时开启并及时关闭。
        enabled: ${ACCESS_TOKEN_ENDPOINT_ENABLED:false}

onebot:
  websocket:
    secret: ${ONEBOT_WEBSOCKET_SECRET:}
# springdoc-openapi项目配置
springdoc:
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha
  api-docs:
    path: /v3/api-docs
  group-configs:
    - group: 'eve-helper-api'
      paths-to-match: '/**'
      packages-to-scan: xyz.foolcat.eve.evehelper
